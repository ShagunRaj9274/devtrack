name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · lint, test, coverage, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: devtrack
          POSTGRES_PASSWORD: devtrack
          POSTGRES_DB: devtrack_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U devtrack -d devtrack_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://devtrack:devtrack@localhost:5432/devtrack_test?schema=public
      TEST_REDIS_URL: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Schema matches migrations
        # Fails if prisma/schema.prisma changed without a migration. Uses a throwaway shadow DB.
        run: |
          PGPASSWORD=devtrack createdb -h localhost -U devtrack devtrack_shadow
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "postgresql://devtrack:devtrack@localhost:5432/devtrack_shadow" \
            --exit-code
      - name: Unit + e2e tests with coverage (thresholds enforced in jest.config.js)
        run: npm run test:cov
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: apps/backend/coverage/coverage-final.json
          retention-days: 14
      - name: Build
        run: npm run build && npm run build:seed

  frontend:
    name: Frontend · lint, typecheck, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000
          NEXT_TELEMETRY_DISABLED: 1

  docker:
    name: Docker · build images and smoke-test the stack
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build and start (waits for every healthcheck)
        run: docker compose up --build --detach --wait --wait-timeout 300
      - name: API is healthy
        run: curl -fsS http://localhost:4000/api/health
      - name: Demo data was seeded and login works
        run: |
          curl -fsS -X POST http://localhost:4000/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"priya@devtrack.dev","password":"Password123"}' | jq -e '.data.accessToken' > /dev/null
      - name: Swagger docs are served
        run: curl -fsS -o /dev/null http://localhost:4000/api/docs
      - name: Web app is served
        run: curl -fsS -o /dev/null http://localhost:3000/login
      - name: Restart keeps data (seed must not wipe it)
        run: |
          login() {
            curl -fsS -X POST http://localhost:4000/api/auth/login -H 'Content-Type: application/json' \
              -d '{"email":"priya@devtrack.dev","password":"Password123"}' | jq -r '.data.accessToken'
          }
          TOKEN=$(login)
          PROJECT=$(curl -fsS -H "Authorization: Bearer $TOKEN" "http://localhost:4000/api/projects?search=WEB" \
            | jq -r '.data[] | select(.key == "WEB") | .id')
          test -n "$PROJECT"
          curl -fsS -X POST -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -d '{"title":"Survives a restart"}' "http://localhost:4000/api/projects/$PROJECT/issues" > /dev/null
          docker compose restart backend
          docker compose up --detach --wait --wait-timeout 120
          TOKEN=$(login)
          COUNT=$(curl -fsS -H "Authorization: Bearer $TOKEN" \
            "http://localhost:4000/api/projects/$PROJECT/issues?search=Survives" | jq '.meta.total')
          test "$COUNT" = "1"
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v

